  text_select_project_custom_workflows: Benutzerdefinierte Workflows für das Projekt auswählen
  text_custom_workflow_before_save_note: Hier können Eigenschaften der Tickets geändert werden. Legen Sie in diesem Skript keine verknüpften Tickets an und ändern Sie keine. Um mit einem Fehler abzubrechen, verwenden Sie `raise RedmineCustomWorkflows::Errors::WorkflowError, 'Nachricht an den Benutzer'`.
  text_custom_workflow_after_save_note: Hier können verknüpfte Tickets angelegt oder geändert werden. Dieses Skript wird auch für neu angelegte Tickets ausgeführt. Bauen Sie deshalb passende Prüfungen ein, um eine endlose Rekursion zu vermeiden.

  text_custom_workflow_issue_code_note: Die Skripte laufen im Kontext des Issue-Objekts wie gewöhnliche before_save- und after_save-Callbacks. Methoden und Eigenschaften des Tickets können also direkt (oder über `self`) verwendet werden. Instanzvariablen (@variable) sind ebenfalls erlaubt.
  text_custom_workflow_issue_relation_code_note: Die Skripte laufen im Kontext des IssueRelation-Objekts wie gewöhnliche before_save- und after_save-Callbacks. Methoden und Eigenschaften der Ticket-Beziehung können also direkt (oder über `self`) verwendet werden. Instanzvariablen (@variable) sind ebenfalls erlaubt.
  text_custom_workflow_shared_code_note: Dieser Code läuft vor allen anderen Workflows und kann gemeinsamen Code enthalten, z. B. Funktionen und Klassen, die andere Workflows benötigen.
  text_custom_workflow_user_code_note: Die Skripte laufen im Kontext des User-Objekts, wenn ein Benutzer geändert oder gelöscht wird. Methoden und Eigenschaften des Benutzers direkt (oder über `self`) verwenden.
  text_custom_workflow_member_code_note: Die Skripte laufen im Kontext des Member-Objekts, wenn ein Mitglied geändert oder gelöscht wird. Methoden und Eigenschaften von @member direkt (oder über `self`) verwenden.
  text_custom_workflow_group_code_note: Die Skripte laufen im Kontext des Group-Objekts, wenn eine Gruppe geändert oder gelöscht wird. Methoden und Eigenschaften der Gruppe direkt (oder über `self`) verwenden.
  text_custom_workflow_group_users_code_note: Diese Skripte laufen, wenn ein Benutzer einer Gruppe hinzugefügt oder aus ihr entfernt wird. Über die Variablen @user und @group greifen Sie in Ihren Skripten auf die Objekte zu.
  text_custom_workflow_attachment_code_note: Die Skripte laufen im Kontext des Attachment-Objekts, wenn ein Dateianhang geändert oder gelöscht wird. Methoden und Eigenschaften des Dateianhangs direkt (oder über `self`) verwenden. Diese Skripte betreffen alle Arten von Dateianhängen (Tickets, Dokumente, Wiki-Seiten usw.). Prüfen Sie deshalb im Skript zusätzlich das Feld 'container_type' oder wählen Sie ein bestimmtes beobachtetes Objekt '... Dateianhänge'.
  text_custom_workflow_issue_attachments_code_note: Diese Skripte laufen, wenn einem Ticket ein Dateianhang hinzugefügt oder entfernt wird. Über die Variablen @issue und @attachment greifen Sie in Ihren Skripten auf die Objekte zu.
  text_custom_workflow_project_code_note: Die Skripte laufen im Kontext des Project-Objekts, wenn ein Projekt geändert oder gelöscht wird. Methoden und Eigenschaften des Projekts direkt (oder über `self`) verwenden.
  text_custom_workflow_project_attachments_code_note: Diese Skripte laufen, wenn einem Projekt eine Datei hinzugefügt oder entfernt wird. Über die Variablen @project und @attachment greifen Sie in Ihren Skripten auf die Objekte zu.
  text_custom_workflow_wiki_content_code_note: Die Skripte laufen im Kontext des WikiContent-Objekts, wenn ein Wiki-Inhalt geändert oder gelöscht wird. Methoden und Eigenschaften des Wiki-Inhalts direkt (oder über `self`) verwenden.
  text_custom_workflow_wiki_page_attachments_code_note: Diese Skripte laufen, wenn einer Wiki-Seite eine Datei hinzugefügt oder entfernt wird. Über die Variablen @page und @attachment greifen Sie in Ihren Skripten auf die Objekte zu.
  text_custom_workflow_time_entry_code_note: Die Skripte laufen im Kontext des TimeEntry-Objekts, wenn eine Zeitbuchung geändert oder gelöscht wird. Methoden und Eigenschaften der Zeitbuchung direkt (oder über `self`) verwenden.
  text_custom_workflow_version_code_note: Die Skripte laufen im Kontext des Version-Objekts, wenn eine Version geändert oder gelöscht wird. Methoden und Eigenschaften der Version direkt (oder über `self`) verwenden.
  text_custom_workflow_before_destroy_note: Um das Löschen des Objekts zu verhindern, `return false` verwenden.

